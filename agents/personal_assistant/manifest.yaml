agent: personal_assistant
version: 0.3.0
description: Reminders, renewals, appointments, and personal daily briefings.
defaults:
  llm: qwen3:8b
  timeout_s: 30
capabilities:
  - id: chat
    description: >
      Conversational fallback for greetings ("hi", "thanks", "good morning"),
      general questions, and any user message that doesn't map to a more
      specific capability. Returns a friendly natural-language reply directly
      from the local LLM (no humanization needed). Use this when no other
      capability fits.
    inputs: { text: string }
    side_effects: false
    cost: low
  - id: add_reminder
    description: Add a reminder with text and a natural-language due time.
    side_effects: true
    cost: low
  - id: list_reminders
    description: List pending or upcoming reminders, optionally filtered.
    side_effects: false
    cost: low
  - id: cancel_reminder
    description: Cancel a reminder by id.
    side_effects: true
    cost: low
  - id: add_renewal
    description: Track a renewal with renewal date and lead-time alerts.
    side_effects: true
    cost: low
  - id: list_renewals
    description: List upcoming renewals within a window.
    side_effects: false
    cost: low
  - id: add_appointment
    description: Add an appointment with start/end time, location, notes.
    side_effects: true
    cost: low
  - id: list_appointments
    description: List upcoming appointments.
    side_effects: false
    cost: low
  - id: morning_brief
    description: Compose today's briefing from reminders, appointments, and unfinished chores.
    side_effects: false
    cost: high
    llm: qwen3:8b
  - id: evening_recap
    description: Compose tomorrow's appointments, tonight's reminders, and recent alerts.
    side_effects: false
    cost: medium
  - id: infer_sleep_summary
    description: Infer last night's sleep quality from HealthKit sleep rows and bedroom observer events, then return a Telegram confirmation keyboard.
    inputs: { member_id: "integer?", night_of: "string?", detected_at: "string?" }
    side_effects: true
    cost: low
  - id: confirm_sleep_summary
    description: Confirm or correct a sleep quality inference from a Telegram quick-reply.
    inputs: { sleep_summary_id: integer, quality: string, chat_id: "integer?" }
    side_effects: true
    cost: low
  - id: late_bedtime_check
    description: Check whether bedroom observer signals are still active after the member's usual bedtime and suggest a wind-down action.
    inputs: { member_id: "integer?", observed_at: "string?", grace_minutes: "integer?" }
    side_effects: false
    cost: low
  - id: infer
    description: Infer one conservative episodic memory from the user's context and recent events, returning a proposed action for confirmation.
    inputs: { context: string }
    side_effects: false
    cost: medium
    llm: qwen3:8b
  - id: infer_presence_return
    description: |
      Guess where someone is returning from when the presence observer sees
      them arrive home, then provide Telegram quick replies for confirmation.
    side_effects: true
    cost: low
  - id: confirm_presence_return
    description: Persist the user's confirmed return context.
    side_effects: true
    cost: low
  - id: recent_presence_returns
    description: List recent presence return-context guesses and confirmations.
    side_effects: false
    cost: low
  - id: auto_infer_observer_event
    description: Automatically evaluate an observer event for one conservative inferred memory and return a confirmation prompt.
    inputs: { agent: "string?", kind: string, summary: "string?", payload: "object?", ts: "string?" }
    side_effects: true
    cost: high
    llm: qwen3:8b
  - id: confirm_auto_inference
    description: Confirm, reject, or skip an auto-inferred memory proposal.
    inputs: { auto_inference_id: integer, status: string, chat_id: "integer?" }
    side_effects: true
    cost: low
subscribes:
  - events.system
  - events.home
publishes:
  # Personal reminder context emits notifications; system events are health/storage-owned.
  - notify.outbound
