agent: household_ops
version: 0.3.0
description: Chores, shopping, pantry, and meal planning.
defaults:
  llm: qwen3-8b-8k
  timeout_s: 45
capabilities:
  - id: chores_add
    description: Add a chore with optional recurrence.
    side_effects: true
    cost: low
  - id: chores_list
    description: List pending chores.
    side_effects: false
    cost: low
  - id: chores_complete
    description: Mark a chore complete and roll recurrence.
    side_effects: true
    cost: low
  - id: shopping_list_add
    description: Add comma-separated shopping items.
    side_effects: true
    cost: low
  - id: shopping_list_show
    description: Show current shopping list.
    side_effects: false
    cost: low
  - id: shopping_list_check
    description: Check items as completed.
    side_effects: true
    cost: low
  - id: shopping_list_clear
    description: Clear shopping list.
    side_effects: true
    require_confirmation: true
    cost: low
  - id: pantry_add
    description: Add pantry item quantity.
    side_effects: true
    cost: low
  - id: pantry_consume
    description: Decrement pantry quantity.
    side_effects: true
    cost: low
  - id: pantry_low_stock
    description: List low-stock pantry items.
    side_effects: false
    cost: low
  - id: meal_plan
    description: Plan meals for N days using pantry and preferences.
    side_effects: false
    cost: high
    llm: qwen36-moe-32k
  - id: meal_recipe
    description: Return recipe for a planned meal.
    side_effects: false
    cost: medium
  - id: infer_cycle_load
    description: |
      Guess what kind of load a finished washer/dryer cycle was and offer
      quick-reply buttons so the user can confirm or correct. Dispatched by
      the appliance.cycle_completed reactive trigger.
    side_effects: true
    cost: low
  - id: confirm_cycle_load
    description: Persist the user's confirmation of a cycle's load type.
    side_effects: true
    cost: low
  - id: recent_cycle_loads
    description: List recent confirmed/unconfirmed appliance loads.
    side_effects: false
    cost: low
  - id: infer_cleaning_run
    description: |
      Infer room-level coverage for a completed vacuum run, persist the run,
      and return a Telegram quick-reply keyboard for confirmation.
    side_effects: true
    cost: low
  - id: confirm_cleaning_run
    description: Persist the user's confirmation of a vacuum cleaning run.
    side_effects: true
    cost: low
  - id: recent_cleaning_runs
    description: List recent vacuum cleaning runs and confirmation status.
    side_effects: false
    cost: low
subscribes:
  - events.home
publishes:
  # Chore due events are user notifications, not system-health signals.
  - notify.outbound
