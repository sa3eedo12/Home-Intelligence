agent: system_health
version: 0.4.0
description: Hardware and container monitoring, anomaly checks, and optimization suggestions.
defaults:
  llm: qwen3-8b-16k
  timeout_s: 30
capabilities:
  - id: scan
    description: One-shot scan including CPU, memory, disk, process, and container health.
    side_effects: false
    cost: medium
  - id: container_status
    description: List all containers with status, restart count, and recent logs.
    side_effects: false
    cost: low
  - id: restart_container
    description: Restart a container by name.
    side_effects: true
    require_confirmation: true
    cost: low
  - id: top_processes
    description: Top N process consumers by CPU or memory.
    side_effects: false
    cost: low
  - id: gpu_status
    description: Return ROCm status from rocm-smi if available.
    side_effects: false
    cost: low
  - id: xdna_status
    description: Return the status of the AMD XDNA NPU device (whether the kernel driver is loaded, the device file exists, and whether any process has it open). On TrueNAS 25.10 the driver is not enabled and this returns `not_present`.
    side_effects: false
    cost: low
  - id: anomaly_check
    description: Compare current metrics to rolling baseline and detect anomalies.
    side_effects: false
    cost: medium
  - id: suggest_optimizations
    description: Propose actionable optimization steps from observed health metrics.
    side_effects: false
    cost: high
subscribes:
  - events.system
publishes:
  - events.system
  # Notifications are produced by reactive triggers from events.system breaches.
