agent: entertainment
version: 0.3.0
description: Recommendations, library indexing/search, and watch history.
defaults:
  llm: qwen3-8b-8k
  timeout_s: 45
capabilities:
  - id: recommend
    description: Recommend media by mood/type using local catalog or LLM fallback.
    side_effects: false
    cost: medium
  - id: library_index
    description: Index local media library from JSON or directory walk into Qdrant.
    side_effects: true
    cost: high
  - id: library_search
    description: Search indexed media metadata.
    side_effects: false
    cost: low
  - id: mark_watched
    description: Mark title watched/played.
    side_effects: true
    cost: low
  - id: recently_watched
    description: Show recent watch/play entries.
    side_effects: false
    cost: low
  - id: discover
    description: LLM-only discovery outside local library.
    side_effects: false
    cost: medium
    llm: qwen3-8b-8k
  - id: suggest_tv_action
    description: Persist a TV/monitor left-on detection and offer Telegram quick actions.
    side_effects: true
    cost: low
  - id: confirm_tv_action
    description: Confirm a TV/monitor left-on action such as turn off, snooze, bedtime auto-off, or skip.
    side_effects: true
    cost: low
  - id: recent_tv_left_on
    description: List recent TV/monitor left-on detections and confirmations.
    side_effects: false
    cost: low
subscribes:
  - events.home
# No publishes: media recommendations and watch history are pull-based today.
publishes: []
