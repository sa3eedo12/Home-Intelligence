agent: dashboard_curator
version: 0.1.0
description: Reads recent agent activity and notifications, and uses the local LLM to produce human-readable narrative summaries that the orchestrator dashboard pins at the top.
defaults:
  llm: qwen3-8b-8k
  timeout_s: 30
capabilities:
  - id: summarize_activity
    description: Summarize the last N minutes of agent activity into a short Markdown narrative and pin it on the dashboard.
    inputs: { window_minutes: "integer?" }
    side_effects: false
    cost: medium
  - id: summarize_alerts
    description: Summarize recent notifications and policy decisions into a short briefing of warn+ severities.
    inputs: { window_minutes: "integer?" }
    side_effects: false
    cost: medium
  - id: agent_card
    description: Produce a one-line status sentence describing what an agent has been doing recently.
    inputs: { agent: string, window_minutes: "integer?" }
    side_effects: false
    cost: low
subscribes:
  - events.activity
publishes:
  - dashboard.updates
