[project]
name = "dashboard_curator"
version = "0.1.0"
description = "Dashboard curator agent: LLM-narrated summaries for the orchestrator dashboard"
requires-python = ">=3.12"
dependencies = [
  "home_agents_sdk",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "fakeredis>=2.28",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
