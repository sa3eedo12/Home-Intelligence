[project]
name = "home_automation"
version = "0.2.0"
description = "Home Automation agent: controls Home Assistant, analyzes Ring doorbell events"
requires-python = ">=3.12"
dependencies = [
  "home_agents_sdk",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "respx>=0.21",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
