agent: home_automation
version: 0.2.0
description: Controls Home Assistant entities, monitors anomalies, suggests automations, and analyzes Ring doorbell events via Scrypted.
defaults:
  llm: qwen3:8b
  timeout_s: 30
capabilities:
  - id: list_entities
    description: List Home Assistant entities grouped by area with friendly names. Hides unavailable entities by default; reports how many were hidden so the user can ask to see them. Filterable by domain (light, switch, sensor, etc.).
    inputs: { domain: "string?", include_unavailable: "boolean?" }
    side_effects: false
    cost: low
  - id: get_entity_state
    description: Return the current state and attributes of a Home Assistant entity by entity_id.
    inputs: { entity_id: string }
    side_effects: false
    cost: low
  - id: call_service
    description: Call a Home Assistant service such as light.turn_on or scene.turn_on. Side-effecting. Returns affected entity names when entity targets are provided.
    inputs: { domain: string, service: string, data: object }
    side_effects: true
    require_confirmation: false
    cost: low
  - id: call_service_in_area
    description: Resolve a Home Assistant area name (for example kitchen), find all entities in that area for the requested domain, and call the service on each matching entity.
    inputs: { area: string, domain: string, service: string, data: "object?" }
    side_effects: true
    require_confirmation: false
    cost: low
  - id: list_areas
    description: List Home Assistant areas from the area registry so dashboards and LLM routing can target rooms by name.
    side_effects: false
    cost: low
  - id: set_scene
    description: Activate a Home Assistant scene by friendly name.
    inputs: { scene_name: string }
    side_effects: true
    cost: low
  - id: list_scenes
    description: List all available scenes.
    side_effects: false
    cost: low
  - id: doorbell.snapshot
    description: Return the latest snapshot from the Ring doorbell (via Scrypted/HA camera entity).
    inputs: { entity_id: "string?" }
    side_effects: false
    cost: low
  - id: doorbell.summarize_event
    description: On a doorbell ring or motion event, fetch the latest snapshot, run NPU vision (yolov8n) for person/package/vehicle detection, and return a short text summary plus structured detections.
    inputs: { entity_id: "string?", event_type: string }
    side_effects: false
    cost: medium
  - id: doorbell.last_visitor
    description: Summarize the most recent visitor event in the last N hours.
    inputs: { hours: integer }
    side_effects: false
    cost: medium
  - id: anomaly.scan
    description: Run a z-score scan over the last 24h of state changes to detect anomalous device behavior.
    inputs: { window_hours: integer }
    side_effects: false
    cost: medium
  - id: suggest_automation
    description: Analyze recent state changes and propose new Home Assistant automations as YAML.
    inputs: { window_hours: integer }
    side_effects: false
    cost: high
    llm: qwen3.6:35b-a3b
  - id: ha.introspect
    description: >
      Discover all capabilities exposed by the Home Assistant MCP server, list existing
      automations, count entities by domain, and surface configuration improvement
      suggestions. Falls back gracefully when the mcp_server integration is not enabled.
    inputs: {}
    side_effects: false
    cost: medium
  - id: recent_appliance_activity
    description: >
      Report recent state and program/cycle attributes for a household appliance
      (washer, dryer, dishwasher, oven, fridge, coffee machine, etc.). Returns
      the current state, recent state changes, brand-aware friendly summaries, and
      integration-specific highlights like 'program', 'remaining_time', 'finish_time'. Use this when the user asks
      "what was the last wash cycle", "is the dishwasher done", "what's the oven set to".
    inputs: { appliance: string, hours: "integer?" }
    side_effects: false
    cost: medium
  - id: lights_off
    description: >-
      Turn off lights. Pass entity_ids for specific lights, area for a substring
      match against entity_id/friendly_name (e.g. "kitchen", "living room"), or
      both empty to turn off ALL real lights (excludes TV backlights, indicator
      strips, etc.). Set only_on=false to force-call even on already-off lights.
    inputs:
      entity_ids: "list[string]?"
      area: "string?"
      only_on: "boolean?"
    side_effects: true
    cost: small
  - id: lights_on
    description: >-
      Turn on lights with optional brightness 0-255. Same arg semantics as
      lights_off.
    inputs:
      entity_ids: "list[string]?"
      area: "string?"
      brightness: "integer?"
    side_effects: true
    cost: small
  - id: lights_status
    description: >-
      Return how many lights are currently on (excluding backlights/indicators)
      and the friendly names. Cheap; safe to call from chat.
    inputs: {}
    side_effects: false
    cost: small
  - id: climate_status
    description: >-
      Report the state of thermostats / HVAC units (current and target
      temperature, mode, supported modes). Pass area (e.g. "bedroom",
      "living room", "office") to scope to one room. Use this for ANY
      thermostat / temperature / AC / heating question — it correctly
      resolves the area without needing the user to know entity_ids.
    inputs:
      area: "string?"
    side_effects: false
    cost: small
  - id: climate_set_temperature
    description: >-
      Set the target temperature on a thermostat / AC / heater. Use this
      for requests like "reduce the bedroom temperature to 22", "make
      the living room cooler", "set the AC to 23". Always pass an area
      (e.g. "bedroom") so the right physical thermostat is selected —
      multiple rooms have a "Thermostat" so you cannot rely on entity_id
      guessing. Returns the old vs new target and whether it was
      clamped to the device's min/max range.
    inputs:
      temperature: number
      area: "string?"
      entity_id: "string?"
    side_effects: true
    require_confirmation: false
    cost: small
  - id: climate_set_mode
    description: >-
      Set HVAC mode (off, cool, heat, auto, dry, fan_only) on a
      thermostat. Use for "turn off the bedroom AC", "switch the
      living room to cool", "set heating in the office". Pass an area
      so the right thermostat is targeted.
    inputs:
      mode: string
      area: "string?"
      entity_id: "string?"
    side_effects: true
    require_confirmation: false
    cost: small
subscribes:
  - events.home
publishes:
  # events.home is produced by ha_event_bridge; memory updates are owned by knowledge_notes.
  - notify.outbound
