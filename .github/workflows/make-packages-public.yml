name: Make GHCR packages public

on:
  workflow_dispatch:

permissions: {}

jobs:
  make-public:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - orchestrator
          - home_automation
          - personal_assistant
          - system_health
          - storage_backup
          - knowledge_notes
          - household_ops
          - entertainment
    steps:
      - name: Flip package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_PAT }}
          PACKAGE: home-intelligence/${{ matrix.service }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GHCR_ADMIN_PAT secret is not set. Create a classic PAT with write:packages scope and add it as a repo secret named GHCR_ADMIN_PAT."
            exit 1
          fi

          response_file=$(mktemp "$RUNNER_TEMP/ghcr-visibility-XXXXXX.json")
          trap 'rm -f "$response_file"' EXIT
          encoded=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1], safe=''))" "$PACKAGE")

          # User-scope endpoint is correct for this repo owner account.
          # If ownership moves to an org, use /orgs/{org}/packages/... instead.
          http_code=$(curl -sS -o "$response_file" -w "%{http_code}" -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/user/packages/container/${encoded}/visibility" \
            -d '{"visibility":"public"}')

          if [ "$http_code" = "204" ]; then
            echo "✅ $PACKAGE is now public"
          elif [ "$http_code" = "404" ]; then
            echo "::error::Package $PACKAGE was not found (HTTP 404). Verify the package exists in GHCR and the PAT owner has access."
            cat "$response_file" || true
            exit 1
          else
            echo "::error::Failed to make $PACKAGE public (HTTP $http_code)"
            cat "$response_file" || true
            exit 1
          fi
