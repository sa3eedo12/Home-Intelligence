name: Build and publish images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: orchestrator
            dockerfile: orchestrator/Dockerfile
          - image_name: home_automation
            dockerfile: agents/home_automation/Dockerfile
          - image_name: personal_assistant
            dockerfile: agents/personal_assistant/Dockerfile
          - image_name: system_health
            dockerfile: agents/system_health/Dockerfile
          - image_name: storage_backup
            dockerfile: agents/storage_backup/Dockerfile
          - image_name: knowledge_notes
            dockerfile: agents/knowledge_notes/Dockerfile
          - image_name: household_ops
            dockerfile: agents/household_ops/Dockerfile
          - image_name: entertainment
            dockerfile: agents/entertainment/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/home-intelligence/${{ matrix.image_name }}:latest
            ghcr.io/${{ github.repository_owner }}/home-intelligence/${{ matrix.image_name }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
