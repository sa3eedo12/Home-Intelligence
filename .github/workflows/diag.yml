name: Check GHCR PAT

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Whoami + list container packages
        env:
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_PAT }}
        run: |
          set -e
          echo "=== Authenticated user ==="
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   https://api.github.com/user | grep '"login"'
          echo
          echo "=== Token scopes ==="
          curl -sS -I -H "Authorization: Bearer $GH_TOKEN" \
                   https://api.github.com/user | grep -i x-oauth-scopes
          echo
          echo "=== My container packages ==="
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/user/packages?package_type=container&per_page=100" \
                   | grep '"name"'
