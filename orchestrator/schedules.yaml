jobs:
  - id: nightly_reflection
    description: "Nightly self-improvement reflection"
    trigger: cron
    cron: { hour: 2, minute: 30 }
    dispatch:
      agent: __orchestrator__
      capability: reflector.run
      inputs: {}

  - id: morning_reflection_digest
    description: "Send the latest Morning Brief to Telegram"
    trigger: cron
    cron: {}
    time_env: MORNING_BRIEF_HOUR
    time_default: "07:30"
    timezone_env: MORNING_BRIEF_TZ
    dispatch:
      agent: __orchestrator__
      capability: morning_brief.send
      inputs: {}

  - id: morning_brief
    description: "Daily morning briefing"
    trigger: cron
    cron: { hour: 7, minute: 30 }
    dispatch:
      agent: personal_assistant
      capability: morning_brief
      inputs: {}
    notify:
      severity: info
      topic: brief.morning

  - id: evening_recap
    description: "Daily evening recap"
    trigger: cron
    cron: { hour: 21, minute: 0 }
    dispatch:
      agent: personal_assistant
      capability: evening_recap
      inputs: {}
    notify: { severity: info, topic: brief.evening }

  - id: system_anomaly_check
    description: "Periodic system anomaly check"
    trigger: interval
    interval: { minutes: 15 }
    dispatch:
      agent: system_health
      capability: anomaly_check
      inputs: {}

  - id: storage_summary
    description: "Nightly storage summary"
    trigger: cron
    cron: { hour: 3, minute: 0 }
    dispatch:
      agent: storage_backup
      capability: summarize_storage
      inputs: {}
    notify: { severity: notice, topic: storage.summary }

  - id: backup_validate
    description: "Daily backup validation"
    trigger: cron
    cron: { hour: 3, minute: 30 }
    dispatch:
      agent: storage_backup
      capability: validate_backup
      inputs: {}
    notify: { severity: notice, topic: storage.backup_validate }

  - id: notes_index
    description: "Nightly notes indexing"
    trigger: cron
    cron: { hour: 2, minute: 0 }
    dispatch:
      agent: knowledge_notes
      capability: index_path
      inputs: { path: "${NOTES_ROOT}" }
    notify: { severity: debug, topic: notes.index }

  - id: pantry_low_stock_check
    description: "Mid-week low pantry stock check"
    trigger: cron
    cron: { day_of_week: "wed,sat", hour: 18, minute: 0 }
    dispatch:
      agent: household_ops
      capability: pantry_low_stock
      inputs: {}
    notify: { severity: notice, topic: household.pantry_low }

  - id: dashboard_summarize_activity
    description: "Refresh the dashboard activity narrative"
    trigger: interval
    interval: { seconds: 60 }
    dispatch:
      agent: dashboard_curator
      capability: summarize_activity
      inputs: { window_minutes: 15 }

  - id: dashboard_summarize_alerts
    description: "Refresh the dashboard alert briefing"
    trigger: interval
    interval: { minutes: 5 }
    dispatch:
      agent: dashboard_curator
      capability: summarize_alerts
      inputs: { window_minutes: 60 }
