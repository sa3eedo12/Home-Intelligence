jobs:
  - id: nightly_reflection
    description: "Nightly self-improvement reflection"
    trigger: cron
    cron: { hour: 2, minute: 30 }
    dispatch:
      agent: __orchestrator__
      capability: reflector.run
      inputs: {}

  - id: nightly_maintenance
    trigger: cron
    cron: { hour: 3, minute: 30 }
    dispatch: { agent: __orchestrator__, capability: data_science.maintenance, inputs: {} }

  - id: nightly_pattern_mining
    trigger: cron
    cron: { hour: 3, minute: 45 }
    dispatch: { agent: __orchestrator__, capability: data_science.pattern_mining, inputs: {} }

  - id: nightly_routine_sequence_mining
    description: "Detect A->B-within-W event sequences for routine inference"
    trigger: cron
    cron: { hour: 3, minute: 50 }
    dispatch: { agent: __orchestrator__, capability: data_science.routine_sequence_mining, inputs: {} }

  - id: weekly_reembed
    trigger: cron
    cron: { day_of_week: "sun", hour: 4, minute: 0 }
    dispatch: { agent: __orchestrator__, capability: data_science.reembed, inputs: {} }

  - id: weekly_report
    trigger: cron
    cron: { day_of_week: "sun", hour: 5, minute: 0 }
    dispatch: { agent: __orchestrator__, capability: data_science.weekly_report, inputs: {} }

  - id: monthly_report
    trigger: cron
    cron: { day: 1, hour: 5, minute: 30 }
    dispatch: { agent: __orchestrator__, capability: data_science.monthly_report, inputs: {} }

  - id: weekly_lora_training
    trigger: cron
    cron: { day_of_week: "sun", hour: 6, minute: 0 }
    dispatch: { agent: __orchestrator__, capability: data_science.lora_training, inputs: {} }

  - id: morning_reflection_digest
    description: "Send the latest Morning Brief to Telegram (gated by wake_time)"
    trigger: interval
    interval: { minutes: 15 }
    dispatch:
      agent: __orchestrator__
      capability: morning_brief.send
      inputs: {}

  - id: advisor_loop
    description: "Daytime suggest-only advisor"
    trigger: interval
    interval: { hours: 4 }
    dispatch:
      agent: __orchestrator__
      capability: advisor.run
      inputs: {}

  - id: morning_brief
    description: "Generate the morning brief content (sender gates on wake_time)"
    trigger: cron
    cron: { hour: 6, minute: 30 }
    dispatch:
      agent: personal_assistant
      capability: morning_brief
      inputs: {}
    notify:
      severity: info
      topic: brief.morning

  - id: evening_recap
    description: "Daily evening recap"
    trigger: cron
    cron: { hour: 21, minute: 0 }
    dispatch:
      agent: personal_assistant
      capability: evening_recap
      inputs: {}
    notify: { severity: info, topic: brief.evening }

  - id: sleep_summary_morning
    description: "Infer last night's sleep quality"
    trigger: cron
    cron: { hour: 8, minute: 0 }
    dispatch:
      agent: personal_assistant
      capability: infer_sleep_summary
      inputs: {}
    notify:
      severity: notice
      topic: sleep.summary
      text_field: summary
      keyboard_field: keyboard

  - id: late_bedtime_check
    description: "Suggest wind-down if bedroom activity continues after usual bedtime"
    trigger: cron
    cron: { hour: 23, minute: 30 }
    dispatch:
      agent: personal_assistant
      capability: late_bedtime_check
      inputs: {}
    notify:
      severity: notice
      topic: sleep.bedtime
      text_field: summary
      keyboard_field: keyboard

  - id: system_anomaly_check
    description: "Periodic system anomaly check"
    trigger: interval
    interval: { minutes: 15 }
    dispatch:
      agent: system_health
      capability: anomaly_check
      inputs: {}

  - id: storage_summary
    description: "Nightly storage summary"
    trigger: cron
    cron: { hour: 3, minute: 0 }
    dispatch:
      agent: storage_backup
      capability: summarize_storage
      inputs: {}
    notify: { severity: notice, topic: storage.summary }

  - id: backup_validate
    description: "Daily backup validation"
    trigger: cron
    cron: { hour: 3, minute: 30 }
    dispatch:
      agent: storage_backup
      capability: validate_backup
      inputs: {}
    notify: { severity: notice, topic: storage.backup_validate }

  - id: notes_index
    description: "Nightly notes indexing"
    trigger: cron
    cron: { hour: 2, minute: 0 }
    dispatch:
      agent: knowledge_notes
      capability: index_path
      inputs: { path: "${NOTES_ROOT}" }
    notify: { severity: debug, topic: notes.index }

  - id: pantry_low_stock_check
    description: "Mid-week low pantry stock check"
    trigger: cron
    cron: { day_of_week: "wed,sat", hour: 18, minute: 0 }
    dispatch:
      agent: household_ops
      capability: pantry_low_stock
      inputs: {}
    notify: { severity: notice, topic: household.pantry_low }

  - id: dashboard_summarize_activity
    description: "Refresh the dashboard activity narrative"
    trigger: interval
    # Was every 60s — 1,440 chat calls/day on qwen3:8b just for the
    # 'Recent activity' tile. That's ~88% of all chat traffic and ~72
    # min of iGPU time per day. Humans don't watch the dashboard at
    # 60s resolution; 5 min matches the alert summary cadence and
    # cuts LLM load by ~80% with no perceptible UX change.
    interval: { minutes: 5 }
    dispatch:
      agent: dashboard_curator
      capability: summarize_activity
      inputs: { window_minutes: 15 }

  - id: dashboard_summarize_alerts
    description: "Refresh the dashboard alert briefing"
    trigger: interval
    interval: { minutes: 5 }
    dispatch:
      agent: dashboard_curator
      capability: summarize_alerts
      inputs: { window_minutes: 60 }

  - id: anomaly_check
    description: "Surface 'today is different' deviations from known patterns"
    trigger: interval
    interval: { minutes: 30 }
    dispatch:
      agent: __orchestrator__
      capability: orchestrator.anomaly_check
      inputs: {}

  - id: missing_routine_check
    description: "Expected by now but not seen — habits + A->B sequence followups"
    trigger: interval
    interval: { minutes: 30 }
    dispatch:
      agent: __orchestrator__
      capability: orchestrator.missing_routine_check
      inputs: {}

  - id: proactive_scan
    description: "Surface gentle 'you usually do X around now' suggestions every 15min"
    trigger: interval
    interval: { minutes: 15 }
    dispatch:
      agent: __orchestrator__
      capability: orchestrator.proactive_scan
      inputs: {}

  - id: pre_bedtime_scan
    description: "Tier'd pre-bedtime nudge (90/30 min before sleep_time) — gated per-member"
    trigger: interval
    interval: { minutes: 15 }
    dispatch:
      agent: __orchestrator__
      capability: orchestrator.pre_bedtime_scan
      inputs: {}
