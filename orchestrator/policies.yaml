quiet_hours:
  enabled: true
  # Fallback used ONLY when no household_member has a sleep_time set.
  # When a member exists with sleep_time/wake_time, the policy engine
  # uses that window instead, so this YAML can stay generic.
  start: "00:30"
  end: "07:00"
  tz: "Asia/Dubai"

allow_during_quiet:
  - severity: critical
  - topic_pattern: "doorbell.*"
  - capability_pattern: "personal_assistant.evening_recap"
  # Sleep-tier notifications are themselves about quiet/bedtime — they
  # ARE the user's signal that quiet is starting and should pass through.
  - topic_pattern: "sleep.*"
  # The wake-time-gated morning brief sender already only fires within
  # the post-wake window; if quiet hours overlap (because the user's
  # wake_time is inside the static-fallback window), the brief should
  # still get through.
  - topic_pattern: "brief.morning"

rate_limits:
  - id: system_health.disk_warn
    match: { agent: "system_health", topic: "disk_warn" }
    max: 1
    window_minutes: 60
  - id: home_automation.suggestion
    match: { agent: "home_automation", topic: "suggestion" }
    max: 3
    window_minutes: 1440
  - id: doorbell.flood
    match: { topic_pattern: "doorbell.*" }
    max: 6
    window_minutes: 10
    rollup_message: "{count} more doorbell events in the last {window_minutes} min."

dedupe:
  default_fingerprint: "{agent}|{topic}|{text|sha256:64}"
  window_minutes: 30

confirmation_required:
  - capability_pattern: "home_automation.call_service"
    when: "data.service in ['lock.unlock'] or data.domain == 'alarm_control_panel'"
  - capability_pattern: "system_health.restart_container"
  - capability_pattern: "household_ops.shopping_list_clear"

manual_overrides:
  ttl_minutes_default: 60
  max_minutes: 720
