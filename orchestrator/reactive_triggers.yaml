triggers:
  - id: doorbell_motion
    stream: events.home
    match:
      type: doorbell_motion
    dispatch:
      agent: home_automation
      capability: doorbell.summarize_event
      inputs: { event_type: "doorbell_motion" }
    notify_from_result:
      text_field: summary
      topic: doorbell.motion
      severity: notice
      keyboard:
        - - { text: "Mute 30 min", callback: "mute:doorbell:30" }
          - { text: "Ignore", callback: "noop" }

  - id: doorbell_ring
    stream: events.home
    match:
      type: doorbell_ring
    dispatch:
      agent: home_automation
      capability: doorbell.summarize_event
      inputs: { event_type: "doorbell_ring" }
    notify_from_result:
      text_field: summary
      topic: doorbell.ring
      severity: alert
      keyboard:
        - - { text: "Speak", callback: "ha:notify:doorbell" }
          - { text: "Ignore", callback: "noop" }

  - id: system_metric_breach
    stream: events.system
    match:
      severity_min: warn
    notify_from_payload:
      text_template: "{metric}={value} crossed threshold ({threshold}). Host: {host}."
      topic_template: "system.{metric}"
      severity_field: severity

  # Observer-derived events. Observers (washer, vacuum, sleep, presence, coffee, tv)
  # publish summarized events into events.observed. Without these reactive
  # triggers, those events never become user-facing notifications.
  - id: appliance_cycle_completed
    stream: events.observed
    match:
      kind: appliance.cycle_completed
    dispatch:
      agent: household_ops
      capability: infer_cycle_load
      # The reactive consumer hands the full envelope (agent/kind/summary/
      # payload/ts) to handle_event as "payload"; the cycle's own fields
      # (appliance, entity_id, duration_seconds, program, etc.) live one
      # level deeper at payload.payload.
      inputs_from: payload.payload
    notify_from_result:
      text_field: summary
      topic: appliance.cycle_completed
      severity: notice
      keyboard_field: keyboard

  - id: tv_left_on
    stream: events.observed
    match:
      kind: entertainment.left_on
    dispatch:
      agent: entertainment
      capability: suggest_tv_action
      inputs_from: payload.payload
    notify_from_result:
      text_field: summary
      topic: entertainment.left_on
      severity: notice
      keyboard_field: keyboard

  - id: cleaning_completed
    stream: events.observed
    match:
      kind: cleaning.completed
    notify_from_payload:
      text_template: "🧹 {summary}."
      topic_template: "cleaning.completed"
      severity_field: severity

  - id: coffee_brewed
    stream: events.observed
    match:
      kind: coffee.brewed
    notify_from_payload:
      text_template: "☕ {summary}."
      topic_template: "coffee.brewed"
      severity_field: severity

  - id: sleep_likely_asleep
    stream: events.observed
    match:
      kind: sleep.likely_asleep
    notify_from_payload:
      text_template: "😴 {summary}."
      topic_template: "sleep.likely_asleep"
      severity_field: severity

  - id: sleep_likely_awake
    stream: events.observed
    match:
      kind: sleep.likely_awake
    notify_from_payload:
      text_template: "🌅 {summary}."
      topic_template: "sleep.likely_awake"
      severity_field: severity
