[project]
name = "home_agents_sdk"
version = "0.1.0"
description = "Shared SDK for Home-Intelligence agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]",
  "httpx>=0.27",
  "pydantic>=2.7",
  "redis>=5.0",
  "asyncpg>=0.29",
  "qdrant-client>=1.10",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "apscheduler>=3.10",
  "python-telegram-bot>=21.0",
  "numpy",
  "onnxruntime",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["home_agents_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
