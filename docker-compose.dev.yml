services:
  redis:
    ports:
      - "6379:6379"

  postgres:
    ports:
      - "5432:5432"

  qdrant:
    ports:
      - "6333:6333"

  ollama:
    ports:
      - "11434:11434"

  lemonade:
    ports:
      - "8000:8000"

  orchestrator:
    ports:
      - "8080:8000"

  home_automation:
    ports:
      - "8101:8000"

  personal_assistant:
    ports:
      - "8102:8000"

  system_health:
    ports:
      - "8103:8000"

  storage_backup:
    ports:
      - "8104:8000"

  knowledge_notes:
    ports:
      - "8105:8000"

  household_ops:
    ports:
      - "8106:8000"

  entertainment:
    ports:
      - "8107:8000"

  sdk-dev:
    image: python:3.12-slim
    working_dir: /workspace/shared
    command: ["sleep", "infinity"]
    volumes:
      - ./shared:/workspace/shared
    networks: [agents]
