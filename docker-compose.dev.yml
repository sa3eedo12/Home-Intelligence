services:
  redis:
    ports:
      - "6379:6379"

  postgres:
    ports:
      - "5432:5432"

  qdrant:
    ports:
      - "6333:6333"

  ollama:
    ports:
      - "11434:11434"

  lemonade:
    ports:
      - "8000:8000"

  orchestrator:
    ports:
      - "8080:8000"

  home_automation:
    ports:
      - "8101:8000"

  sdk-dev:
    image: python:3.12-slim
    working_dir: /workspace/shared
    command: ["sleep", "infinity"]
    volumes:
      - ./shared:/workspace/shared
    networks: [agents]
