# =============================================================================
# Home-Intelligence stack for TrueNAS SCALE (Fangtooth 25.04+) Custom Apps
# =============================================================================
# - Single self-contained compose file (no overlays).
# - Inline ROCm + NPU device passthrough; the GPU must be isolated in
#   System Settings -> Advanced -> GPU before the apps user can claim it.
# - Runs as the TrueNAS apps user (UID 568, GID 568) and joins host
#   `video` and `render` groups via numeric GIDs (44 + 107 are the
#   conventional numeric IDs on TrueNAS SCALE; adjust if your host differs).
# - All bind-mount sources are rooted at ${TRUENAS_APPDATA}; create the
#   dataset and chown -R 568:568 it before deployment.
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    # No `user:` override: the upstream image runs as the built-in
    # `redis` user (UID 999) and its entrypoint chowns /data correctly.
    # Forcing UID 568 here breaks that and causes "Permission denied"
    # on the appendonly dir.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ${TRUENAS_APPDATA}/infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [agents]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    # No `user:` override: postgres entrypoint must run as root briefly to
    # chown PGDATA, then drops to the `postgres` user itself.
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ${TRUENAS_APPDATA}/infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [agents]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    env_file: .env
    # No `user:` override: qdrant initializes /qdrant/storage on first
    # boot and needs write access on the named volume's root.
    command: ["./qdrant", "--config-path", "/qdrant/config/config.yaml"]
    volumes:
      - qdrant-data:/qdrant/storage
      - ${TRUENAS_APPDATA}/infra/qdrant/config.yaml:/qdrant/config/config.yaml:ro
    healthcheck:
      # qdrant image does not ship `curl`; use bash's /dev/tcp probe instead.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [agents]

  ollama:
    image: ollama/ollama:rocm
    restart: unless-stopped
    env_file: .env
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "44"   # video (default GID on most Debian-based hosts)
      - "107"  # render (default GID on most Debian-based hosts)
    environment:
      # Radeon 890M (gfx1150). Fallback if needed: 11.0.0
      HSA_OVERRIDE_GFX_VERSION: "11.5.1"
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_NO_ANALYTICS: "1"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # Recent ollama:rocm images have stripped `curl`; use the ollama
      # binary itself which is guaranteed to be present.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [agents]

  lemonade:
    # =====================================================================
    # NOTE: TrueNAS SCALE 25.10 (Goldeye) does NOT ship the `amdxdna`
    # kernel module, so the XDNA 2 NPU is unavailable on this OS today.
    # We therefore run the same lightweight CPU stub used by the
    # MinisCloud variant: a tiny Python HTTP server that satisfies the
    # /health probe so the rest of the stack stays healthy. The
    # orchestrator and curator route around the missing NPU by using
    # iGPU-served models (see .env.truenas.example: ROUTER_MODEL,
    # EMBED_MODEL).
    #
    # When iX Systems eventually enables CONFIG_DRM_ACCEL_AMDXDNA in a
    # TrueNAS kernel build, replace this block with the NPU-enabled one
    # documented in docs/DEPLOY-TRUENAS.md ("Future: NPU-enabled
    # variant" appendix).
    # =====================================================================
    image: python:3.12-alpine
    restart: unless-stopped
    env_file: .env
    # Run as root inside the container (the python:alpine image expects it).
    # This is the CPU stub; nothing privileged is exposed to the host.
    command:
      - sh
      - -lc
      - |
        python - <<'PY'
        import json
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path == '/health':
                    self.send_response(200)
                    self.end_headers()
                    self.wfile.write(b'ok')
                elif self.path in ('/v1/models', '/api/v1/models'):
                    # Pretend to be an OpenAI-compatible /models endpoint with
                    # an empty model list so dashboard health probes don't 404.
                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({'data': []}).encode())
                else:
                    self.send_response(404)
                    self.end_headers()
            def log_message(self, format, *args):
                pass
        HTTPServer(('0.0.0.0', 8000), Handler).serve_forever()
        PY
    volumes:
      - lemonade-models:/models
    healthcheck:
      # Use python (guaranteed in this image) for the probe; busybox
      # wget exists but its exit code semantics with broken pipes can
      # confuse the healthcheck on cold start.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).read()==b'ok' else 1)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [agents]

  orchestrator:
    image: ghcr.io/sa3eedo12/home-intelligence/orchestrator:latest
    env_file: .env
    user: "568:568"
    ports:
      # Dashboard exposed on the LAN. TrueNAS users can change the host port
      # in the Apps GUI if 8080 conflicts.
      - "8080:8000"
    volumes:
      # Persistent location for nightly data-science reports + LoRA training
      # data. Writable by the apps user (UID 568); created by the user during
      # deploy via `mkdir -p $TRUENAS_APPDATA/data/{reports,lora}`.
      - ${TRUENAS_APPDATA}/data/reports:/data/reports
      - ${TRUENAS_APPDATA}/data/lora:/data/lora
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      lemonade: { condition: service_healthy }
      ollama: { condition: service_healthy }
      home_automation: { condition: service_started }
      personal_assistant: { condition: service_started }
      system_health: { condition: service_started }
      storage_backup: { condition: service_started }
      knowledge_notes: { condition: service_started }
      household_ops: { condition: service_started }
      entertainment: { condition: service_started }
      dashboard_curator: { condition: service_started }
    networks: [agents]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  home_automation:
    image: ghcr.io/sa3eedo12/home-intelligence/home_automation:latest
    env_file: .env
    user: "568:568"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      lemonade: { condition: service_healthy }
      ollama: { condition: service_healthy }
    networks: [agents]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  personal_assistant:
    image: ghcr.io/sa3eedo12/home-intelligence/personal_assistant:latest
    env_file: .env
    user: "568:568"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      lemonade: { condition: service_healthy }
      ollama: { condition: service_healthy }
    networks: [agents]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  system_health:
    image: ghcr.io/sa3eedo12/home-intelligence/system_health:latest
    env_file: .env
    pid: "host"
    # Apps user cannot access /var/run/docker.sock on TrueNAS; rely on
    # /proc + /sys for host metrics. Container introspection degrades to
    # "docker socket unavailable" gracefully (see agents/system_health/tools/core.py).
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      lemonade: { condition: service_healthy }
      ollama: { condition: service_healthy }
    networks: [agents]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  storage_backup:
    image: ghcr.io/sa3eedo12/home-intelligence/storage_backup:latest
    env_file: .env
    # No user override: this agent needs to read TrueNAS pool datasets
    # mounted under /mnt, which are owned by various dataset users.
    # Run as root inside the container (TrueNAS apps user can still run
    # privileged container processes via the apps engine).
    environment:
      STORAGE_SCAN_ROOTS: /mnt
    volumes:
      - /mnt:/mnt:ro
      - ${TRUENAS_APPDATA}/infra/storage_backup/backup_targets.yaml:/etc/storage_backup/backup_targets.yaml:ro
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      lemonade: { condition: service_healthy }
      ollama: { condition: service_healthy }
    networks: [agents]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  knowledge_notes:
    image: ghcr.io/sa3eedo12/home-intelligence/knowledge_notes:latest
    env_file: .env
    user: "568:568"
    volumes:
      - ${TRUENAS_APPDATA}/data/notes:/data/notes
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      lemonade: { condition: service_healthy }
      ollama: { condition: service_healthy }
    networks: [agents]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  household_ops:
    image: ghcr.io/sa3eedo12/home-intelligence/household_ops:latest
    env_file: .env
    user: "568:568"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      lemonade: { condition: service_healthy }
      ollama: { condition: service_healthy }
    networks: [agents]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  entertainment:
    image: ghcr.io/sa3eedo12/home-intelligence/entertainment:latest
    env_file: .env
    user: "568:568"
    volumes:
      - ${TRUENAS_APPDATA}/data/media:/data/media
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      lemonade: { condition: service_healthy }
      ollama: { condition: service_healthy }
    networks: [agents]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard_curator:
    image: ghcr.io/sa3eedo12/home-intelligence/dashboard_curator:latest
    env_file: .env
    user: "568:568"
    depends_on:
      redis: { condition: service_healthy }
      ollama: { condition: service_healthy }
    networks: [agents]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  agents:
    driver: bridge

volumes:
  redis-data:
  pg-data:
  qdrant-data:
  ollama-data:
  lemonade-models:
